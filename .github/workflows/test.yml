name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck gitum install.sh tests/run.sh
      - name: tests
        run: bash tests/run.sh
      - name: tests under bash 3.2
        if: runner.os == 'macOS'
        env:
          GITUM_TEST_BASH: /bin/bash
        run: /bin/bash tests/run.sh
